name: humanclicker

on:
  push:
    paths:
      - 'humanclicker/**'
      - '.github/workflows/humanclicker.yml'
  pull_request:
    paths:
      - 'humanclicker/**'
      - '.github/workflows/humanclicker.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: humanclicker
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Gradle wrapper olustur (yoksa)
        run: |
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.10
          fi

      - name: Build
        run: ./gradlew --no-daemon build

      - name: Derlenen jar'i yukle
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: human-clicker-jar
          path: humanclicker/build/libs/*.jar
