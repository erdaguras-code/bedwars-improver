name: humanclicker

on:
  push:
    paths:
      - 'humanclicker/**'
      - '.github/workflows/humanclicker.yml'
  pull_request:
    paths:
      - 'humanclicker/**'
      - '.github/workflows/humanclicker.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: humanclicker
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Fabric Loom 1.7 Gradle 9 ile calismiyor (Problems.forNamespace kaldirildi),
      # runner'in varsayilani ise artik Gradle 9.x. Bu yuzden surumu 8.10'a
      # sabitliyoruz. Wrapper'a gerek yok; bu adim gradle'i kendisi kuruyor.
      - name: Gradle 8.10 kur
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Build
        run: gradle --no-daemon build

      - name: Derlenen jar'i yukle
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: human-clicker-jar
          path: humanclicker/build/libs/*.jar
