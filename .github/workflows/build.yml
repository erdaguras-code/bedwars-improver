name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Runner'daki Gradle 9.x, Fabric Loom 1.7 ile uyumsuz. Wrapper'i bos bir
      # dizinde uretiyoruz ki bu projenin build script'i o Gradle ile hic
      # calistirilmasin; derleme wrapper'daki 8.10 ile yapilir.
      - name: Gradle wrapper olustur (yoksa)
        run: |
          if [ ! -f gradlew ]; then
            mkdir -p "$RUNNER_TEMP/wrapper-gen"
            (cd "$RUNNER_TEMP/wrapper-gen" && gradle wrapper --gradle-version 8.10)
            cp "$RUNNER_TEMP/wrapper-gen/gradlew" .
            cp "$RUNNER_TEMP/wrapper-gen/gradlew.bat" .
            mkdir -p gradle/wrapper
            cp "$RUNNER_TEMP/wrapper-gen/gradle/wrapper/gradle-wrapper.jar" gradle/wrapper/
            chmod +x gradlew
          fi

      - name: Build
        run: ./gradlew --no-daemon build

      - name: Derlenen jar'i yukle
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: bedwars-trainer-jar
          path: build/libs/*.jar

      # Derleme hatasi olursa log zaten Actions ciktisinda gorunur.
