name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Runner'a on kurulu Gradle 9.x, Fabric Loom 1.7 ile uyumsuz; wrapper
      # surumu 8.10'a sabitliyor. Yerelde de ayni komut calisir: ./gradlew build
      - name: Gradle kurulumu (wrapper 8.10)
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew --no-daemon build

      # Sadece kurulmaya hazir jar yuklensin; -sources ve -dev jar'lari
      # mods klasorune atilinca "mixin not found" hatasi veriyor.
      - name: Derlenen jar'i yukle
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: bedwars-trainer-jar
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
            !build/libs/*-dev.jar

      # Derleme hatasi olursa log zaten Actions ciktisinda gorunur.
