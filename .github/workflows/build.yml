name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Gradle wrapper olustur (yoksa)
        run: |
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.10
          fi

      - name: Build
        run: ./gradlew --no-daemon build

      - name: Derlenen jar'i yukle
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: bedwars-trainer-jar
          path: build/libs/*.jar

      # Derleme hatasi olursa log zaten Actions ciktisinda gorunur.
